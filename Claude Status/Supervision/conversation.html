<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:">
<style>
  :root {
    color-scheme: light dark;
    --text: #1d1d1f; --muted: #6e6e73; --faint: #a1a1a6; --rule: #e5e5ea;
    --user-bg: rgba(10, 132, 255, 0.12); --code-bg: rgba(0, 0, 0, 0.05);
    --wait-bg: rgba(255, 159, 10, 0.14); --wait: #c26b00; --error: #d70015;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text: #f5f5f7; --muted: #a1a1a6; --faint: #6e6e73; --rule: #3a3a3c;
      --user-bg: rgba(10, 132, 255, 0.22); --code-bg: rgba(255, 255, 255, 0.07);
      --wait-bg: rgba(255, 159, 10, 0.18); --wait: #ffb340; --error: #ff6961;
    }
  }
  html, body { margin: 0; background: transparent; }
  body { font: 13px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; color: var(--text); padding: 12px 16px 16px; }
  .entry { margin: 0 0 12px; }
  .user { display: flex; justify-content: flex-end; }
  .user > div { background: var(--user-bg); border-radius: 10px; padding: 6px 10px; max-width: 80%; }
  .thinking { color: var(--faint); font-size: 11px; font-style: italic; }
  .tool { font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); white-space: pre-wrap; }
  .tool b { color: var(--text); font-weight: 600; margin-right: 6px; }
  .tool.ask { color: var(--wait); }
  .result { font: 10.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted);
            white-space: pre-wrap; margin-left: 18px; max-height: 6.2em; overflow: hidden; }
  .result.error { color: var(--error); }
  .md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
  .md p, .md ul, .md ol, .md pre, .md table, .md blockquote { margin: 0 0 8px; }
  .md h1, .md h2, .md h3, .md h4 { margin: 12px 0 6px; line-height: 1.3; }
  .md h1 { font-size: 18px; } .md h2 { font-size: 16px; } .md h3 { font-size: 14px; } .md h4 { font-size: 13px; }
  .md ul, .md ol { padding-left: 22px; }
  .md code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--code-bg); border-radius: 4px; padding: 1px 4px; }
  .md pre { background: var(--code-bg); border-radius: 6px; padding: 8px 10px; overflow-x: auto; }
  .md pre code { background: none; padding: 0; }
  .md table { border-collapse: collapse; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--rule); padding: 4px 8px; vertical-align: top; }
  .md th:not([align]), .md td:not([align]) { text-align: left; }
  .md th { background: var(--code-bg); font-weight: 600; }
  .md blockquote { border-left: 3px solid var(--rule); margin-left: 0; padding-left: 10px; color: var(--muted); }
  .md a { color: #0a84ff; }
  .mermaid { margin: 4px 0 8px; overflow-x: auto; }
  .mermaid svg { max-width: 100%; height: auto; }
  .empty { color: var(--faint); }
  #waiting { position: sticky; bottom: -16px; margin: 16px -16px -16px; padding: 10px 16px 12px;
             background: var(--wait-bg); border-top: 1px solid var(--rule); backdrop-filter: blur(20px); }
  #waiting .title { color: var(--wait); font-weight: 600; margin-bottom: 4px; }
  #waiting .md { max-height: 12em; overflow-y: auto; }
</style>
<script src="marked.min.js"></script>
<script src="mermaid.min.js"></script>
</head>
<body>
<div id="log"><p class="empty">Nothing to show yet.</p></div>
<div id="waiting" hidden><div class="title">Waiting for your answer</div><div class="md" id="question"></div></div>
<script>
  const escapeHTML = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // Transcripts hold arbitrary text (tool output, pasted pages): raw HTML is shown, never run.
  marked.use({ gfm: true, breaks: false, renderer: { html: ({ text }) => escapeHTML(text) } });

  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  mermaid.initialize({ startOnLoad: false, securityLevel: "strict", theme: dark ? "dark" : "default" });

  // Rendered diagrams by source, so a refresh doesn't redraw (and flicker) them.
  const diagramCache = new Map();
  let diagramCount = 0;

  function markdown(text) {
    const div = document.createElement("div");
    div.className = "md";
    div.innerHTML = marked.parse(text);
    for (const code of div.querySelectorAll("pre > code.language-mermaid")) {
      const holder = document.createElement("div");
      holder.className = "mermaid";
      holder.dataset.source = code.textContent;
      code.parentElement.replaceWith(holder);
    }
    return div;
  }

  async function drawDiagrams(root) {
    for (const holder of root.querySelectorAll(".mermaid")) {
      const source = holder.dataset.source;
      let svg = diagramCache.get(source);
      if (svg === undefined) {
        try {
          svg = (await mermaid.render("diagram" + (++diagramCount), source)).svg;
        } catch (error) {
          svg = null;
        }
        diagramCache.set(source, svg);
      }
      if (svg) {
        holder.innerHTML = svg;
      } else {
        const pre = document.createElement("pre");
        pre.className = "result error";
        pre.textContent = source;
        holder.replaceWith(pre);
      }
    }
  }

  function entryNode(entry) {
    const node = document.createElement("div");
    node.className = "entry";
    switch (entry.kind) {
      case "user": {
        node.classList.add("user");
        node.appendChild(markdown(entry.text));
        break;
      }
      case "assistant":
        node.appendChild(markdown(entry.text));
        break;
      case "thinking":
        node.className += " thinking";
        node.textContent = "Thinking…";
        break;
      case "tool": {
        node.className += " tool" + (entry.name === "AskUserQuestion" ? " ask" : "");
        const name = document.createElement("b");
        name.textContent = entry.name;
        node.append(name, entry.text);
        break;
      }
      case "result":
        node.className += " result" + (entry.isError ? " error" : "");
        node.textContent = entry.text || "(no output)";
        break;
    }
    return node;
  }

  // Called from Swift with { entries: [...], waiting: "question" | null }.
  window.render = async function (payload) {
    const scroller = document.scrollingElement;
    const atBottom = scroller.scrollHeight - scroller.scrollTop - innerHeight < 40;

    const log = document.getElementById("log");
    const fragment = document.createDocumentFragment();
    for (const entry of payload.entries) fragment.appendChild(entryNode(entry));
    if (!payload.entries.length) fragment.appendChild(Object.assign(document.createElement("p"), { className: "empty", textContent: "Nothing to show yet." }));
    log.replaceChildren(fragment);

    const waiting = document.getElementById("waiting");
    waiting.hidden = !payload.waiting;
    const question = document.getElementById("question");
    question.replaceChildren(...(payload.waiting ? markdown(payload.waiting).childNodes : []));

    await drawDiagrams(document.body);
    if (atBottom || payload.scrollToBottom) scroller.scrollTop = scroller.scrollHeight;
  };
</script>
</body>
</html>
